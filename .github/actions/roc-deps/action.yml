# The Roc the cookbook's Roc self-tests are judged by, for test.yml and
# c-full.yml alike: the Roc at cookbook/roc/pinned.shale's SELF_TEST_PIN
# and roc-types built for that pin, both under ~/tools, each download's
# checksum checked.
name: roc-deps
description: the pinned Roc and roc-types under ~/tools

runs:
  using: composite
  steps:
    # rewrite_method_calls.shale's typed plant reads Roc's checker's types from
    # ~/tools/roc-types/bin/roc-types: the asset showell/roc-types publishes
    # for the pin below (SELF_TEST_PIN), its URL and sha256 those of that
    # repo's `release` file, the checksum checked. It is pinned here, as
    # Roc is, so a new roc-types pin there moves Shale's only with Shale's.
    - name: Install roc-types
      shell: bash
      run: |
        url=https://github.com/showell/roc-types/releases/download/roc-types-1-0.1.0_RC1/roc-types-1-0.1.0_RC1-linux-x86_64.tar.gz
        sha=e4dc859dcff19fc625ba567452bc033934eb6aa2ec4621ec337576a4f4d8603d
        curl -fsSL -o /tmp/roc-types.tar.gz "$url"
        echo "$sha  /tmp/roc-types.tar.gz" | sha256sum -c -
        mkdir -p ~/tools/roc-types
        tar -xzf /tmp/roc-types.tar.gz -C ~/tools/roc-types
        test -x ~/tools/roc-types/bin/roc-types

    # The Roc rewrites' self-tests (cookbook/roc/rewrite_method_calls.shale and
    # check_stacking.shale) are judged by the compiler itself, at
    # tools:roc-0.1.0_RC1/roc (cookbook/roc/pinned.shale's SELF_TEST_PIN,
    # roc-types' pin): roc-lang/roc's release 0.1.0_RC1, its checksum the one
    # GitHub publishes for it, and its `roc version` the pin.
    - name: Install Roc
      shell: bash
      run: |
        curl -fsSL -o /tmp/roc.tar.gz https://github.com/roc-lang/roc/releases/download/0.1.0_RC1/roc-linux_x86_64-0.1.0_RC1.tar.gz
        echo "043c426ea85dcdbd427951eaed246f0c10c171d988f2598782233a6dae43379d  /tmp/roc.tar.gz" | sha256sum -c -
        mkdir -p ~/tools/roc-0.1.0_RC1
        tar -xzf /tmp/roc.tar.gz -C ~/tools/roc-0.1.0_RC1 --strip-components=1
        test "$(~/tools/roc-0.1.0_RC1/roc version)" = "Roc compiler version 0.1.0_RC1"

    # A second nightly, which rewrite_method_calls' goldens pin a copy of the
    # plants to (its Pin case): the tree's Roc is then another than the one
    # roc-types was built for, and the run must stop saying so. Only its path
    # is read; it never runs.
    - name: Install a second Roc, for a pin roc-types refuses
      shell: bash
      run: |
        curl -fsSL -o /tmp/roc-1107.tar.gz https://github.com/roc-lang/nightlies/releases/download/nightly-2026-11-07-ad3a5d2/roc_nightly-linux_x86_64-2026-11-07-ad3a5d2.tar.gz
        echo "21710f7007403428d96f5927343c60c2b3dbefc298394d62cf066fe6fa966495  /tmp/roc-1107.tar.gz" | sha256sum -c -
        mkdir -p ~/tools/roc-nightly-2026-11-07-ad3a5d2
        tar -xzf /tmp/roc-1107.tar.gz -C ~/tools/roc-nightly-2026-11-07-ad3a5d2 --strip-components=1
        test -x ~/tools/roc-nightly-2026-11-07-ad3a5d2/roc
