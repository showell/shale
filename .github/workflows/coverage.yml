# Zig Shale's coverage gate (legacy_zig/, deprecated and frozen),
# `shale tools/coverage.shale` there, on demand only (`gh workflow run
# coverage.yml -f ref=<ref>`): `zig build script-coverage` (the coverage SDK's
# linecov, under ptrace, over the unit binaries built Debug) read back and
# held to coverage/lines.txt, each module's uncovered count exactly.
name: coverage

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to measure"
        default: master
        required: true

concurrency:
  group: coverage-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    # The floor is the box's, so the runner is the box's Ubuntu: on 26.04,
    # curl unfolds a folded header itself, and the prelude's own unfolding
    # (legacy_zig/src/shale_prelude_linux.shale, `http`) never runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: shale
          # The git prelude's tests read shale's own history.
          fetch-depth: 0

      - uses: ./shale/.github/actions/unit-deps

      # build.zig resolves `script-coverage` only with the SDK checked out
      # beside shale (a lazy path dependency, ../zig-coverage-sdk).
      - uses: actions/checkout@v7
        with:
          repository: showell/zig-coverage-sdk
          ref: main
          path: zig-coverage-sdk

      # The coverage script is Shale, run by this tree's own `shale`, built
      # Debug by `zig build script` (seconds; the installed ReleaseSafe one
      # takes LLVM minutes), the checkout its root.
      - name: shale tools/coverage.shale
        working-directory: shale/legacy_zig
        run: |
          zig version
          zig build script -- --root "$PWD" tools/coverage.shale
