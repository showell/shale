# tools/roc_types built into the asset tools/roc_types/install.shale
# installs, on demand only (`gh workflow run roc-types.yml -f ref=<ref>`),
# never on a push or a PR: it links most of Roc's compiler, which the box
# cannot build beside its other work. The tarball is the run's artifact
# (`gh run download`), its sha256 in the log; publishing it, and moving
# tools/roc_types/release to it, is by hand.
name: roc-types

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to build roc-types from"
        default: master
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: shale

      # roc-types builds with the Zig the pinned Roc builds with, which its
      # own zig-version names, not Shale's.
      - name: Install Zig
        working-directory: shale/tools/roc_types
        run: |
          curl -fsSL https://raw.githubusercontent.com/showell/patched-zig-compiler/main/tools/get_zig.sh | sh
          echo "$HOME/zig-$(tr -d '[:space:]' < zig-version)" >> "$GITHUB_PATH"

      # The archive build.zig.zon pins leaves out vendor/, which Roc's
      # modules import, so the build forks to a full checkout of the commit.
      - name: Roc at the pin
        run: |
          commit=$(grep -o 'archive/[0-9a-f]*' shale/tools/roc_types/build.zig.zon | cut -d/ -f2)
          git init -q roc && cd roc
          git remote add origin https://github.com/roc-lang/roc.git
          git fetch -q --depth 1 origin "$commit"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$commit"

      - name: Build roc-types
        working-directory: shale/tools/roc_types
        run: |
          zig version
          zig build --fork="$GITHUB_WORKSPACE/roc" -Dtarget=x86_64-linux-musl -Dcpu=baseline --prefix "$GITHUB_WORKSPACE/out"
          test -x "$GITHUB_WORKSPACE/out/bin/roc-types"

      # The plant rewrite_method_calls.shale's self-test reads types through, by a
      # relative path: the header is the format's and the pin's, and the
      # imported type module has its types.
      - name: Smoke
        working-directory: shale
        run: |
          format=$(sed -n 's/^const format = \([0-9]*\);$/\1/p' tools/roc_types/main.zig)
          version=$(tr -d '[:space:]' < tools/roc_types/roc-version)
          "$GITHUB_WORKSPACE/out/bin/roc-types" cookbook/roc/plants/rewrite_method_calls/TypedApp.roc > /tmp/types.out
          test "$(head -n 1 /tmp/types.out)" = "roc-types $format $version"
          grep -q '^== /.*/cookbook/roc/plants/rewrite_method_calls/Typed.roc$' /tmp/types.out
          grep -cP '^t\t' /tmp/types.out

      # The fixtures of tools/roc_types/test.shale, which holds them to their
      # records on the box: an app whose package has a package of its own and
      # an app on the Echo platform are checked, and one with a type error in
      # the inner package is refused. An asset that fails here is never built.
      - name: Fixtures
        working-directory: shale
        run: |
          bin="$GITHUB_WORKSPACE/out/bin/roc-types"
          "$bin" tools/roc_types/tests/nested/app/main.roc > /tmp/nested.out
          grep -q '^== /.*/tools/roc_types/tests/nested/inner/Inner.roc$' /tmp/nested.out
          "$bin" tools/roc_types/tests/echo/main.roc > /tmp/echo.out
          grep -q '^== /.*/tools/roc_types/tests/echo/main.roc$' /tmp/echo.out
          if "$bin" tools/roc_types/tests/broken/app/main.roc > /tmp/broken.out; then exit 1; fi
          if grep -q '^== ' /tmp/broken.out; then exit 1; fi

      - name: Tarball
        id: tarball
        working-directory: shale
        run: |
          format=$(sed -n 's/^const format = \([0-9]*\);$/\1/p' tools/roc_types/main.zig)
          test -n "$format"
          short=$(tr -d '[:space:]' < tools/roc_types/roc-version | sed 's/.*-//')
          name="roc-types-$format-$short-linux-x86_64.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$name" -C "$GITHUB_WORKSPACE/out" bin/roc-types
          cd "$GITHUB_WORKSPACE" && sha256sum "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: ${{ steps.tarball.outputs.name }}
