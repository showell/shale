# `zig build test`, on demand only: dispatched by cookbook/gh_build.shale
# (or `gh workflow run test.yml -f ref=<ref>`), never on a push or a PR.
name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to test"
        default: master
        required: true

concurrency:
  group: test-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: shale
          # The git prelude's tests read shale's own history.
          fetch-depth: 0

      # build.zig.zon's `webbox` is the sibling ../zig-webbox; the other
      # path dependency, ../zig-coverage-sdk, is lazy and `test` never
      # fetches it.
      - uses: actions/checkout@v4
        with:
          repository: showell/zig-webbox
          ref: master
          path: zig-webbox
          # zig_move's tests replay zig-webbox commits by `git show`.
          fetch-depth: 0

      # shale's zig-version names the pin when there is one; otherwise
      # patched-zig-compiler's own zig-version, its newest release.
      - name: Zig version
        id: zig
        run: |
          if [ -f shale/zig-version ]; then
            pin=$(tr -d '[:space:]' < shale/zig-version)
          else
            pin=$(curl -fsSL https://raw.githubusercontent.com/showell/patched-zig-compiler/main/zig-version | tr -d '[:space:]')
          fi
          echo "version=$pin" >> "$GITHUB_OUTPUT"

      # Restore and save apart: actions/cache's own save waits for the
      # job's success, and a red run would install Zig again every time.
      - uses: actions/cache/restore@v4
        id: zig-cache
        with:
          path: ~/zig-${{ steps.zig.outputs.version }}
          key: zig-${{ steps.zig.outputs.version }}

      - name: Install Zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        working-directory: shale
        run: curl -fsSL https://raw.githubusercontent.com/showell/patched-zig-compiler/main/tools/get_zig.sh | sh

      - uses: actions/cache/save@v4
        if: steps.zig-cache.outputs.cache-hit != 'true'
        with:
          path: ~/zig-${{ steps.zig.outputs.version }}
          key: zig-${{ steps.zig.outputs.version }}

      - name: Zig on PATH
        run: |
          echo "$HOME/zig-${{ steps.zig.outputs.version }}" >> "$GITHUB_PATH"

      # `test`'s cookbook-test runs the Roc name hunt's self-test, which reads
      # Roc's parser's tree from ~/tools/roc-ast/bin/roc-ast: roc-apps's
      # release asset (5 MB, static), its checksum checked, so it always runs
      # here; without it the step fails, never skips.
      - name: Install roc-ast
        run: |
          curl -fsSL -o /tmp/roc-ast.tar.gz https://github.com/showell/roc-apps/releases/download/toolchain-2026-10-30-0602c5f/roc-ast-258ab27-linux-x86_64.tar.gz
          echo "0f92336c8a7d7976ea80684a473c2cf3fe882d6cf64b2133c239a70023818a2f  /tmp/roc-ast.tar.gz" | sha256sum -c -
          mkdir -p ~/tools/roc-ast
          tar -xzf /tmp/roc-ast.tar.gz -C ~/tools/roc-ast
          test -x ~/tools/roc-ast/bin/roc-ast

      # The Roc rewrites' self-tests (cookbook/roc/methods.shale and
      # stack.shale) are judged by the compiler itself, the same release's
      # (70 MB), tools:roc-nightly-2026-10-30-0602c5f/roc (each recipe's
      # SELF_TEST_PIN).
      - name: Install Roc
        run: |
          curl -fsSL -o /tmp/roc.tar.gz https://github.com/showell/roc-apps/releases/download/toolchain-2026-10-30-0602c5f/roc-nightly-2026-10-30-0602c5f-linux-x86_64.tar.gz
          echo "1257dc7a3a1c79ec2c4b60df2c2f54f2a9c3b92b0773f5896018897d05ca9406  /tmp/roc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/roc.tar.gz -C ~/tools
          test -x ~/tools/roc-nightly-2026-10-30-0602c5f/roc

      - name: zig build test
        working-directory: shale
        run: |
          zig version
          zig build test --summary failures
