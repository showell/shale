# `zig build test` of Zig Shale (legacy_zig/, deprecated and frozen), on demand only: dispatched by cookbook/build_on_github.shale
# (or `gh workflow run test.yml -f ref=<ref>`), never on a push or a PR.
name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to test"
        default: master
        required: true

concurrency:
  group: test-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: shale
          # The git prelude's tests read shale's own history.
          fetch-depth: 0

      # zig-webbox beside shale, the pinned Zig, roc-ast and go-ast: what
      # the unit tests need, coverage.yml's too. (The other path
      # dependency, ../zig-coverage-sdk, is lazy, and `test` never fetches it.)
      - uses: ./shale/.github/actions/unit-deps

      # The pinned Roc nightly and roc-types, for the Roc rewrites' self-tests.
      - uses: ./shale/.github/actions/roc-deps

      - name: zig build test
        working-directory: shale/legacy_zig
        run: |
          zig version
          zig build test --summary failures
