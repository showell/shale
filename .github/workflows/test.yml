# `zig build test`, on demand only: dispatched by cookbook/build_on_github.shale
# (or `gh workflow run test.yml -f ref=<ref>`), never on a push or a PR.
name: test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to test"
        default: master
        required: true

concurrency:
  group: test-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: shale
          # The git prelude's tests read shale's own history.
          fetch-depth: 0

      # zig-webbox beside shale, the pinned Zig, roc-ast and go-ast: what
      # the unit tests need, coverage.yml's too. (The other path
      # dependency, ../zig-coverage-sdk, is lazy, and `test` never fetches it.)
      - uses: ./shale/.github/actions/unit-deps

      # rewrite_method_calls.shale's typed plant reads Roc's checker's types from
      # ~/tools/roc-types/bin/roc-types: the asset built by roc-types.yml from
      # Shale's tools/roc_types, its URL and sha256 read from
      # tools/roc_types/release (install.shale's too), the checksum checked.
      # A placeholder there fails this step, never skips it.
      - name: Install roc-types
        working-directory: shale
        run: |
          url=$(sed -n 's/^url //p' tools/roc_types/release)
          sha=$(sed -n 's/^sha256 //p' tools/roc_types/release)
          case "$url $sha" in *TODO*) echo "tools/roc_types/release holds a placeholder: publish the roc-types asset first"; exit 1;; esac
          curl -fsSL -o /tmp/roc-types.tar.gz "$url"
          echo "$sha  /tmp/roc-types.tar.gz" | sha256sum -c -
          mkdir -p ~/tools/roc-types
          tar -xzf /tmp/roc-types.tar.gz -C ~/tools/roc-types
          test -x ~/tools/roc-types/bin/roc-types

      # The Roc rewrites' self-tests (cookbook/roc/rewrite_method_calls.shale and
      # check_stacking.shale) are judged by the compiler itself, at
      # tools:roc-nightly-2026-11-03-34bd006/roc (cookbook/roc/pinned.shale's
      # SELF_TEST_PIN, roc-types' pin): Roc's own nightly release, its checksum
      # checked. The runner's CPU has the SHA extension the stock build needs.
      - name: Install Roc
        run: |
          curl -fsSL -o /tmp/roc.tar.gz https://github.com/roc-lang/nightlies/releases/download/nightly-2026-11-03-34bd006/roc_nightly-linux_x86_64-2026-11-03-34bd006.tar.gz
          echo "d5c769579edd8e26114b5a89c16e7e074295649a6721a620c98a090eb2bb62c7  /tmp/roc.tar.gz" | sha256sum -c -
          mkdir -p ~/tools/roc-nightly-2026-11-03-34bd006
          tar -xzf /tmp/roc.tar.gz -C ~/tools/roc-nightly-2026-11-03-34bd006 --strip-components=1
          test -x ~/tools/roc-nightly-2026-11-03-34bd006/roc

      - name: zig build test
        working-directory: shale
        run: |
          zig version
          zig build test --summary failures
