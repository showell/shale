# C Shale's full tier, `shale c/build.shale full=1`, on demand only: dispatched
# by cookbook/build_on_github.shale (`workflow=c-full.yml`), or `gh workflow
# run c-full.yml -f ref=<ref>`, never on a push, a PR or a schedule. It
# builds the first `shale` from C with no shale installed (c/docs/building.md,
# "First install on a new machine"), installs it by c/install.shale, then runs
# the full tier, its output kept as the run's artifact `c-full-log`.
name: c-full

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The shale branch, tag or commit to test"
        default: master
        required: true
      plants:
        description: "`none` runs no plants (a plain full=1); `all` runs every one (full=1 plants=all)"
        type: choice
        options: [none, all]
        default: none

concurrency:
  group: c-full-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub's `bash` is `bash -eo pipefail`, so a tee keeps the tier's exit.
    shell: bash

jobs:
  full:
    # The box's Ubuntu, 24.04: its GCC 13 and the TCC whose bugs style.md
    # steers around (0.9.27+git20200814), which the discipline check's canary
    # holds.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # No checkout keeps its credentials: a kept one is a git config
      # include under the runner's temp folder, which a program confined to
      # the mounts (c/host/host_confine.c) cannot read, and git stops on a
      # config it cannot read. The tier pushes nothing.
      #
      # The folder that holds the checkouts is the `repos` mount, and the
      # docs check resolves shale's citations in every sibling of
      # tools/doc_check.shale's REPOS, as the box has them all: a citation
      # found only in an optional one (`.shale/prelude.shale`, roc-apps') is
      # gone without it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          path: shale
          # The git prelude's goldens and the plants' proofs read history.
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/angry-gopher
          ref: master
          path: angry-gopher

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/roc-apps
          ref: master
          path: roc-apps

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/roc-chat
          ref: main
          path: roc-chat

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/roc-markdown
          ref: main
          path: roc-markdown

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/chat-client
          ref: main
          path: chat-client

      # zig-ast, the program behind the Zig builtins (the host_zig block
      # speaks to it), at a pinned commit, built below by the Zig its
      # zig-version pins.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          repository: showell/zig-ast
          ref: 7ca0aab74d357e2fdde98f4ce1b22cc23f1d3387
          path: zig-ast

      # TCC, and the box's git: Ubuntu 24.04's own 2.43, in place of the
      # newer one the runner image carries. The goldens freeze git's messages
      # and the folders a bare `git init` makes, and a newer git changes both.
      - name: Install TCC and git 2.43
        run: |
          sudo apt-get update -q
          ver=$(apt-cache madison git | awk '$3 ~ /^1:2\.43\./ {print $3; exit}')
          test -n "$ver"
          sudo apt-get install -y -q --allow-downgrades tcc "git=$ver" "git-man=$ver"
          tcc -v
          git --version
          gcc --version | head -1

      # The pinned Zig on PATH, roc-ast and go-ast under ~/tools (and
      # zig-webbox beside shale, which the full tier doesn't read).
      - uses: ./shale/.github/actions/unit-deps

      # The pinned Roc nightly and roc-types, for the Roc recipes' self-tests.
      - uses: ./shale/.github/actions/roc-deps

      # Its build takes about two minutes, so the binary is cached by the
      # commit above and the Zig, built for the baseline x86-64 CPU: a
      # native build cached on one runner's CPU died of an illegal
      # instruction (popcnt) on another's; restored and saved apart, as unit-deps'
      # Zig is, so a red tier still keeps it.
      - uses: actions/cache/restore@v6
        id: zig-ast-cache
        with:
          path: ~/tools/zig-ast
          key: zig-ast-baseline-7ca0aab74d357e2fdde98f4ce1b22cc23f1d3387-${{ hashFiles('zig-ast/zig-version') }}

      - name: Install zig-ast
        if: steps.zig-ast-cache.outputs.cache-hit != 'true'
        working-directory: zig-ast
        run: |
          test "$(tr -d '[:space:]' < zig-version)" = "$(zig version)"
          zig build -Dcpu=baseline --prefix ~/tools/zig-ast

      - uses: actions/cache/save@v6
        if: steps.zig-ast-cache.outputs.cache-hit != 'true'
        with:
          path: ~/tools/zig-ast
          key: zig-ast-baseline-7ca0aab74d357e2fdde98f4ce1b22cc23f1d3387-${{ hashFiles('zig-ast/zig-version') }}

      - name: zig-ast's header
        run: |
          said=$(~/tools/zig-ast/bin/zig-ast --serve < /dev/null)
          case "$said" in "zig-ast serve "*) echo "$said" ;; *) echo "zig-ast said: $said"; exit 1 ;; esac

      # The runner's own mounts file, made here: the tools, the writable
      # `build` and `scratch` folders the golden tests and recipes use, the
      # checkouts' folder as `repos` (writable: a root inside a read-only
      # mount is read-only too, and the tier writes c/out), this checkout's
      # cookbook, and the
      # `localbin` c/install.shale links `shale` in. Git commits as a
      # placeholder identity (the goldens pin their own).
      - name: Mounts and git
        run: |
          mkdir -p ~/.config/shale ~/.local/bin ~/build ~/scratch ~/tools/shale/bin
          cat > ~/.config/shale/mounts <<EOF
          tools = $HOME/tools tools
          localbin = $HOME/.local/bin
          build = $HOME/build
          scratch = $HOME/scratch
          repos = $GITHUB_WORKSPACE
          cookbook = $GITHUB_WORKSPACE/shale/cookbook ro
          EOF
          cat ~/.config/shale/mounts
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config --global user.name "shale c-full"
          git config --global user.email "c-full@localhost"
          git config --global init.defaultBranch master

      # c/docs/building.md's "First install on a new machine", line for line:
      # the first `shale`, by TCC and GCC alone, runs c/install.shale, which
      # runs the fast tier and the smoke test and links ~/.local/bin/shale.
      - name: First install
        working-directory: shale
        run: |
          tcc -run c/gen_preludes.c
          mkdir -p c/out/release
          gcc -std=c11 -Wall -Wextra -Werror -Ic/foundation -O2 -Ic/out/gen -Ic c/shale.c -o c/out/release/shale
          PATH="$HOME/.local/bin:$PWD/c/out/release:$PATH" shale c/install.shale
          command -v shale
          shale --version

      # The runner's own umask, 022: the golden tests set theirs
      # (tests/golden.shale).
      - name: Full tier
        working-directory: shale
        run: |
          plants=""
          if [ "${{ inputs.plants }}" = all ]; then plants="plants=all"; fi
          start=$SECONDS
          shale c/build.shale full=1 $plants 2>&1 | tee "$RUNNER_TEMP/c-full.log"
          echo "full tier: $((SECONDS - start)) s of wall time" | tee -a "$RUNNER_TEMP/c-full.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c-full-log
          path: ${{ runner.temp }}/c-full.log
          if-no-files-found: ignore
