<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shale Playground</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@600&display=swap">
<style>
/* Layout: a workbench. Files | the open file | what the run did; stacked on a phone. */
:root {
  --bg: #e9ecef;
  --panel: #f7f8f9;
  --ink: #1c2228;
  --muted: #5a6570;
  --line: #cbd2d8;
  --accent: #a55a17;
  --accent-ink: #ffffff;
  --ok: #2b7149;
  --stop: #b0261c;
  --select: #dfe4e9;
  --font-display: "Zilla Slab", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --code-size: 13px;
  --code-line: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181c; --panel: #1b2025; --ink: #e2e6e9; --muted: #95a0aa; --line: #2d343b;
    --accent: #d88b47; --accent-ink: #1a1208; --ok: #6cbf8b; --stop: #f07c70; --select: #262d34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181c; --panel: #1b2025; --ink: #e2e6e9; --muted: #95a0aa; --line: #2d343b;
  --accent: #d88b47; --accent-ink: #1a1208; --ok: #6cbf8b; --stop: #f07c70; --select: #262d34;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--font-body);
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  box-sizing: border-box;
  gap: 12px;
}
button, input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, .row:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 16px;
}
header h1 {
  font: 600 26px/1 var(--font-display);
  margin: 0;
  letter-spacing: 0.01em;
}
header p { margin: 0; color: var(--muted); max-width: 70ch; }

.bench {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(180px, 230px) minmax(0, 1.2fr) minmax(0, 1fr);
  gap: 12px;
}
.pane {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  min-height: 34px;
}
.label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.grow { flex: 1; }

.btn {
  border: 1px solid var(--line);
  background: transparent;
  border-radius: 4px;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 13px;
}
.btn:hover { background: var(--select); }
.btn:disabled { opacity: 0.45; cursor: default; background: transparent; }
.btn.run {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 600;
  padding: 3px 14px;
}
.btn.run:hover { filter: brightness(1.08); }
.btn.run:disabled { background: var(--accent); filter: none; }
kbd { font: 11px var(--font-code); opacity: 0.8; }

/* Files */
.tree { overflow: auto; padding: 6px 0; flex: 1; font: var(--code-size)/1.6 var(--font-code); }
.row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 1px 10px 1px calc(10px + var(--depth) * 14px);
  cursor: pointer;
  white-space: nowrap;
}
.row:hover { background: var(--select); }
.row.dir { color: var(--muted); cursor: default; }
.row.dir:hover { background: transparent; }
.row.open { background: var(--select); font-weight: 500; }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.row .mark {
  font: 600 10px/1 var(--font-body);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
.row .del {
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  padding: 0 2px;
  visibility: hidden;
}
.row:hover .del, .row.open .del { visibility: visible; }
.row .del:hover { color: var(--stop); }
.confirm {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  font: 12px var(--font-body);
  background: var(--select);
}
.newfile { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.newfile input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  padding: 3px 6px;
  font: 12px var(--font-code);
}

/* The open file */
.path { font: 500 var(--code-size) var(--font-code); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dirty { color: var(--accent); font-weight: 600; }
.args { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px; }
.args input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--bg);
  padding: 2px 6px;
  font: 12px var(--font-code);
}
.editor { flex: 1; display: flex; min-height: 0; overflow: hidden; }
.gutter {
  margin: 0;
  padding: 10px 8px 10px 10px;
  text-align: right;
  color: var(--muted);
  opacity: 0.7;
  font: var(--code-size)/var(--code-line) var(--font-code);
  user-select: none;
  overflow: hidden;
  min-width: 2.5ch;
  border-right: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  resize: none;
  padding: 10px 12px;
  background: transparent;
  font: var(--code-size)/var(--code-line) var(--font-code);
  tab-size: 2;
  white-space: pre;
  overflow: auto;
}
textarea:focus-visible { outline: none; }
.hint { padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

/* What the run did */
.out { flex: 1; overflow: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 12px; }
.out pre {
  margin: 0;
  font: var(--code-size)/var(--code-line) var(--font-code);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.out .none { color: var(--muted); font-style: italic; }
.intro { color: var(--muted); max-width: 52ch; display: grid; gap: 8px; }
.intro p { margin: 0; }
.intro code { font: 12px var(--font-code); color: var(--ink); }
.effects { display: grid; gap: 2px; font: 12px/1.5 var(--font-code); }
.effects .op { color: var(--accent); font-weight: 500; }
.ending {
  border-left: 3px solid var(--ok);
  padding: 4px 10px;
  font: 12px/1.5 var(--font-code);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.ending.stopped { border-color: var(--stop); color: var(--stop); }
.ending .trail { color: var(--muted); }
.diff-add { color: var(--ok); }
.diff-del { color: var(--stop); }
.diff-hunk { color: var(--muted); }

@media (max-width: 860px) {
  html, body { height: auto; }
  .bench { grid-template-columns: minmax(0, 1fr); }
  .pane.files .tree { max-height: 32vh; }
  .pane.editor-pane { height: 60vh; }
  .pane.output { min-height: 30vh; }
}
@media (prefers-reduced-motion: no-preference) {
  .row.fresh .mark { animation: fade 1.6s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>
</head>
<body>
<header>
  <h1>Shale</h1>
  <p>A scripting language for working on a project's files, where every run has a budget. Here it runs in your browser, on a small Python project that lives only in this page.</p>
</header>

<main class="bench">
  <section class="pane files" aria-label="Files">
    <div class="bar"><span class="label grow">Files</span><button class="btn" id="reset" type="button">Reset project</button></div>
    <div class="tree" id="tree" role="list"></div>
    <form class="newfile" id="newfile">
      <input id="newpath" placeholder="new file, e.g. scripts/mine.shale" aria-label="New file path" spellcheck="false">
      <button class="btn" type="submit">Add</button>
    </form>
  </section>

  <section class="pane editor-pane" aria-label="Open file">
    <div class="bar">
      <span class="path" id="path"></span><span class="dirty" id="dirty" hidden title="Not saved">●</span>
      <span class="grow"></span>
      <button class="btn" id="save" type="button">Save <kbd>⌘S</kbd></button>
    </div>
    <div class="bar" id="runbar">
      <label class="args" for="args"><span class="label">Args</span><input id="args" placeholder="name=value name=value" spellcheck="false"></label>
      <button class="btn run" id="run" type="button">Run <kbd>⌘↵</kbd></button>
    </div>
    <div class="editor">
      <pre class="gutter" id="gutter" aria-hidden="true">1</pre>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="File contents"></textarea>
    </div>
    <div class="hint" id="hint" hidden>Only <code>.shale</code> files run. Open one under <code>scripts/</code>, or add your own.</div>
  </section>

  <section class="pane output" aria-label="What the run did">
    <div class="bar"><span class="label grow">Run</span><span class="label" id="steps"></span></div>
    <div class="out" id="out">
      <div class="intro">
        <p>Loading Shale…</p>
      </div>
    </div>
  </section>
</main>

<script type="module">
import { loadShale } from "./shale.js";
import { sample, first } from "./sample.js";

const $ = (id) => document.getElementById(id);
const tree = $("tree"), code = $("code"), gutter = $("gutter"), out = $("out");
// Named by the sample's version: a new sample starts fresh, not from files
// saved against the old one.
const STORE_KEY = "shale-playground-files-2";

let shale;
let open = null;        // the open file's path
let saved = "";         // its text as the tree has it
let changed = new Set(); // paths the last run changed
let confirming = null;  // the path a delete is waiting on

function remember() {
  try {
    const files = {};
    for (const e of shale.list()) if (!e.dir) files[e.path] = shale.read(e.path);
    localStorage.setItem(STORE_KEY, JSON.stringify(files));
  } catch {}
}

function recalled() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function seed(files) {
  shale.clear();
  for (const [p, d] of Object.entries(files)) shale.put(p, d);
}

const isScript = (p) => p && p.endsWith(".shale");

function drawTree() {
  tree.replaceChildren();
  for (const e of shale.list()) {
    const parts = e.path.split("/");
    const row = document.createElement("div");
    row.className = "row" + (e.dir ? " dir" : "") + (e.path === open ? " open" : "");
    row.style.setProperty("--depth", parts.length - 1);
    row.setAttribute("role", "listitem");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = parts.at(-1) + (e.dir ? "/" : "");
    row.append(name);
    if (!e.dir) {
      row.tabIndex = 0;
      row.title = `${e.path}, ${e.size} bytes`;
      if (changed.has(e.path)) {
        row.classList.add("fresh");
        const mark = document.createElement("span");
        mark.className = "mark";
        mark.textContent = "changed";
        row.append(mark);
      }
      const del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "×";
      del.setAttribute("aria-label", `Delete ${e.path}`);
      del.addEventListener("click", (ev) => {
        ev.stopPropagation();
        confirming = e.path;
        drawTree();
      });
      row.append(del);
      row.addEventListener("click", () => openFile(e.path));
      row.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter") openFile(e.path);
      });
    }
    tree.append(row);
    if (confirming === e.path) tree.append(confirmRow(e.path));
  }
}

function confirmRow(path) {
  const box = document.createElement("div");
  box.className = "confirm";
  const say = document.createElement("span");
  say.className = "grow";
  say.textContent = `Delete ${path.split("/").at(-1)}?`;
  const yes = Object.assign(document.createElement("button"), { className: "btn", type: "button", textContent: "Delete" });
  const no = Object.assign(document.createElement("button"), { className: "btn", type: "button", textContent: "Keep" });
  yes.addEventListener("click", () => {
    shale.remove(path);
    confirming = null;
    remember();
    if (path === open) {
      open = null;
      openFile(firstFile());
    } else drawTree();
  });
  no.addEventListener("click", () => {
    confirming = null;
    drawTree();
  });
  box.append(say, yes, no);
  return box;
}

function firstFile() {
  const files = shale.list().filter((e) => !e.dir).map((e) => e.path);
  return files.includes(first) ? first : files.find(isScript) ?? files[0] ?? null;
}

function drawGutter() {
  const n = code.value.split("\n").length;
  let s = "";
  for (let i = 1; i <= n; i++) s += i + "\n";
  gutter.textContent = s;
  gutter.scrollTop = code.scrollTop;
}

function showDirty() {
  $("dirty").hidden = code.value === saved;
}

function openFile(path) {
  if (open && code.value !== saved) save();
  open = path;
  saved = path ? shale.read(path) ?? "" : "";
  code.value = saved;
  code.disabled = !path;
  code.scrollTop = 0;
  $("path").textContent = path ?? "No file open";
  $("run").disabled = !isScript(path);
  $("args").disabled = !isScript(path);
  $("hint").hidden = !path || isScript(path);
  showDirty();
  drawGutter();
  drawTree();
}

function save() {
  if (!open || code.value === saved) return;
  shale.put(open, code.value);
  saved = code.value;
  showDirty();
  remember();
  drawTree();
}

function parseArgs(text) {
  const args = {};
  for (const w of text.trim().split(/\s+/)) {
    const eq = w.indexOf("=");
    if (eq > 0) args[w.slice(0, eq)] = w.slice(eq + 1);
  }
  return args;
}

const el = (tag, cls, text) => Object.assign(document.createElement(tag), { className: cls ?? "", textContent: text ?? "" });

// Output with a diff's lines coloured, as `edit` prints them.
function outputBlock(text) {
  const pre = el("pre");
  if (!text) {
    pre.append(el("span", "none", "(nothing printed)"));
    return pre;
  }
  for (const line of text.split(/(?<=\n)/)) {
    let cls = "";
    if (line.startsWith("+++ ") || line.startsWith("--- ")) cls = "diff-hunk";
    else if (line.startsWith("@@")) cls = "diff-hunk";
    else if (line.startsWith("+")) cls = "diff-add";
    else if (line.startsWith("-")) cls = "diff-del";
    pre.append(cls ? el("span", cls, line) : document.createTextNode(line));
  }
  return pre;
}

function run() {
  if (!isScript(open)) return;
  save();
  const r = shale.run(code.value, parseArgs($("args").value), open);
  const lines = r.report.split("\n").filter((l) => l);
  const effects = lines.filter((l) => !l.startsWith("── ") && !l.startsWith("   called from"));
  const endIndex = lines.findIndex((l) => l.startsWith("── finished") || l.startsWith("── stopped"));
  const ending = lines.slice(endIndex);
  changed = new Set(effects.map((l) => l.slice(l.indexOf(" ") + 1, l.lastIndexOf(": "))));

  out.replaceChildren();
  out.append(outputBlock(r.output));
  if (effects.length) {
    const box = el("div", "effects");
    box.append(el("span", "label", `Changes (${effects.length})`));
    for (const l of effects) {
      const row = el("div");
      const sp = l.indexOf(" ");
      row.append(el("span", "op", l.slice(0, sp)), document.createTextNode(l.slice(sp)));
      box.append(row);
    }
    out.append(box);
  }
  const end = el("div", "ending" + (r.finished ? "" : " stopped"));
  end.append(document.createTextNode(ending[0].replace(/^── /, "")));
  for (const t of ending.slice(1)) end.append(el("div", "trail", t.trim()));
  out.append(end);
  const m = ending[0].match(/\((\d+) steps\)/);
  $("steps").textContent = m ? `${Number(m[1]).toLocaleString()} steps` : "";

  // The script may have changed the open file, itself included.
  const now = shale.read(open);
  if (now !== null && now !== saved) {
    saved = now;
    code.value = now;
    drawGutter();
  }
  if (now === null) {
    open = null;
    openFile(firstFile());
  }
  remember();
  drawTree();
}

code.addEventListener("input", () => {
  showDirty();
  drawGutter();
});
code.addEventListener("scroll", () => (gutter.scrollTop = code.scrollTop));
code.addEventListener("keydown", (ev) => {
  if (ev.key === "Tab" && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    ev.preventDefault();
    const { selectionStart: a, selectionEnd: b } = code;
    code.setRangeText("  ", a, b, "end");
    showDirty();
    drawGutter();
  }
});
document.addEventListener("keydown", (ev) => {
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key === "Enter") {
    ev.preventDefault();
    run();
  } else if (mod && ev.key.toLowerCase() === "s") {
    ev.preventDefault();
    save();
  }
});
$("run").addEventListener("click", run);
$("save").addEventListener("click", save);
$("reset").addEventListener("click", () => {
  try { localStorage.removeItem(STORE_KEY); } catch {}
  seed(sample);
  changed = new Set();
  open = null;
  openFile(first);
  showIntro();
});
$("newfile").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const p = $("newpath").value.trim().replace(/^\/+/, "");
  if (!p) return;
  const known = shale.list().find((e) => e.path === p);
  if (known && known.dir) return;
  if (!known) {
    try {
      shale.put(p, isScript(p) ? `-- ${p.split("/").at(-1)}\n\nprint("hello from Shale")\n` : "");
    } catch {
      $("newpath").setCustomValidity("That path runs through a file, or is not a path.");
      $("newpath").reportValidity();
      return;
    }
  }
  $("newpath").value = "";
  remember();
  openFile(p);
  code.focus();
});
$("newpath").addEventListener("input", () => $("newpath").setCustomValidity(""));

function showIntro() {
  out.replaceChildren();
  $("steps").textContent = "";
  const intro = el("div", "intro");
  intro.innerHTML = `
    <p>Each script under <code>scripts/</code> works on the project beside it: it reads files, edits them, and writes new ones. Press <b>Run</b> to try the open one.</p>
    <p>Some take Args: <code>rename.shale</code> <code>from=format_day to=render_day</code>, <code>bump_version.shale</code> <code>part=minor</code>. <code>runaway.shale</code> never ends, so its step budget stops it.</p>
    <p>Edit any file, or add your own script. The files live in this page only; <b>Reset project</b> brings the sample back.</p>`;
  out.append(intro);
}

try {
  const bytes = await (await fetch("./shale.wasm")).arrayBuffer();
  shale = await loadShale(bytes);
} catch (e) {
  out.replaceChildren(el("div", "ending stopped", `Shale did not load: ${e.message}. This page needs a browser with WebAssembly.`));
  throw e;
}
seed(recalled() ?? sample);
openFile(firstFile());
showIntro();
</script>
</body>
</html>
